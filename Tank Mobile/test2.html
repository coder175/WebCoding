<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Selector</title>
    <style>
        #sliderParent {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: Arial, sans-serif;
        }
        .slider {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 15%;
            right: -20%;
            transform: translate(-50%, -50%);
            width: calc(25vw + 25vh);
            height: calc(25vw + 25vh);
            overflow: hidden;
        }
        .element-container {
            position: relative;
            width: 0;
            height: 0;
        }
        .element {
            position: absolute;
            text-align: center;
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
            font-size: 2.5vh;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 0.25vh solid rgba(255, 255, 255, 0.3);
            border-radius: 1.5vh;
            padding: 2vh;
            width: 10vh;
            height: 10vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.3);
        }
        .element.selected.dragging {
            transform: scale(1.5);
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            box-shadow: 0 1vh 2vh rgba(255, 255, 255, 0.5);
        }
        .element:not(.selected) {
            opacity: 0.6;
        }
    </style>
</head>
<body>
<div id="sliderParent">
<div class="slider" id="sliderArea">
    <div class="element-container" id="elementContainer">
        <div class="element" data-index="0">1</div>
        <div class="element" data-index="1">2</div>
        <div class="element" data-index="2">3</div>
    </div>
</div>
</div>

<script>
    const sliderArea = document.getElementById('sliderArea');
    const elements = document.querySelectorAll('.element');
    const elementCount = elements.length;
    let selectedIndex = 0;
    let startX = 0;
    let currentX = 0;
    let isDragging = false;
    let rotationAngle = 0;
    const anglePerElement = 360 / elementCount;
    const radius = (window.innerWidth * 0.5 + window.innerHeight * 0.5) * 0.1;
    const swipeSensitivity = 0.75;

    function updateSlider() {
        elements.forEach((element, index) => {
            const angle = ((index - selectedIndex + elementCount) % elementCount) * anglePerElement + rotationAngle;
            const radian = (angle * Math.PI) / 180;
            const x = Math.sin(radian) * radius;
            const y = Math.cos(radian) * radius * -1;
            const scale = isDragging && angle % 360 === 0 ? 1.5 : 1;
            element.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
            element.classList.toggle('selected', scale > 1);
        });
    }

    sliderArea.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) return;
        startX = e.touches[0].clientX;
        currentX = startX;
        isDragging = true;
        updateSlider();
    });

    sliderArea.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        currentX = e.touches[0].clientX;
        const deltaX = currentX - startX;
        let newRotation = (deltaX / sliderArea.clientWidth) * 360 / swipeSensitivity;
        if (Math.abs(newRotation) > anglePerElement) {
            newRotation = Math.sign(newRotation) * anglePerElement;
        }
        rotationAngle = newRotation;
        updateSlider();
    });

    sliderArea.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        const direction = rotationAngle > 0 ? -1 : 1;
        if (Math.abs(rotationAngle) > anglePerElement / 2) {
            selectedIndex = (selectedIndex + direction + elementCount) % elementCount;
        }
        rotationAngle = 0;
        updateSlider();
    });

    // Initialize slider
    updateSlider();
</script>
</body>
</html>
